services:
  postgres:
    image: postgres:17
    container_name: training-life-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5433 -> contenedor 5432, para no chocar con el PostgreSQL 17
      # nativo instalado en Windows (servicio postgresql-x64-17, puerto 5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: training-life-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Monta toda la carpeta backend/ (código, migraciones, todo) para que
      # --reload de uvicorn detecte cambios sin reconstruir la imagen, y para
      # que las migraciones nuevas generadas con el venv local (contra
      # localhost:5433) lleguen también al contenedor al instante — antes solo
      # se montaba backend/app, y una migración nueva sin rebuild dejaba al
      # contenedor con alembic/versions/ desactualizado, provocando un bucle
      # de reinicio en cuanto se reiniciaba (ver CLAUDE.md, "Backend:
      # decisiones técnicas"). Solo requirements.txt sigue necesitando
      # "docker compose up -d --build" (cambia qué hay instalado, no un archivo).
      - ./backend:/app
      # Volumen anónimo: "tapa" backend/.venv dentro del contenedor con una
      # carpeta vacía, en vez de montar el venv real de Windows (miles de
      # archivos que el contenedor nunca usa — usa su propio Python del
      # sistema, no ese venv). Sin esto, --reload tendría que vigilar esa
      # carpeta de más sin ningún beneficio.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
