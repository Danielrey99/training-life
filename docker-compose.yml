services:
  postgres:
    image: postgres:17
    container_name: training-life-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5433 -> contenedor 5432, para no chocar con el PostgreSQL 17
      # nativo instalado en Windows (servicio postgresql-x64-17, puerto 5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: training-life-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Monta el código para que --reload de uvicorn detecte cambios sin reconstruir la imagen.
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
