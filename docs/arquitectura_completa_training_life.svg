<svg width="1200" height="740" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura completa de Training Life con recorrido de una petición</title>
<desc>Diagrama detallado: navegador y app móvil envían peticiones HTTP hacia Docker, donde Uvicorn recibe, FastAPI valida con Pydantic, SQLAlchemy traduce a SQL y PostgreSQL ejecuta la consulta, con Alembic gestionando migraciones y docker-compose.yml inyectando la configuración (DATABASE_URL)</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="1200" height="740" fill="#ffffff"/>



<!-- Mi PC -->
<rect x="60" y="120" width="730" height="575" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="80" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Mi PC</text>

<!-- Carpeta local -->
<rect x="90" y="165" width="190" height="496" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="185" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Proyecto en tu PC</text>
<text x="185" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">web/</text>
<text x="185" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">backend/</text>

<!-- Docker wrapper -->
<rect x="370" y="165" width="390" height="496" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="390" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4A1B0C">Docker</text>
<text x="390" y="212" font-family="Arial, sans-serif" font-size="11" fill="#712B13">docker-compose organiza los contenedores</text>
<text x="390" y="226" font-family="Arial, sans-serif" font-size="11" fill="#712B13">cada uno con su propio Dockerfile</text>

<!-- Web container -->
<rect x="390" y="238" width="350" height="45" rx="8" fill="#5DCAA5" stroke="#085041" stroke-width="1"/>
<text x="565" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#04342C">Web</text>
<text x="565" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#04342C">React (Vite)</text>

<line x1="565" y1="283" x2="565" y2="300" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="580" y="295" font-family="Arial, sans-serif" font-size="11" fill="#444441">2. fetch a la API</text>

<!-- Backend outer -->
<rect x="390" y="300" width="350" height="226" rx="10" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
<text x="405" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Backend (Python)</text>
<text x="405" y="335" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">DATABASE_URL viene de docker-compose.yml</text>

<rect x="405" y="357" width="320" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="565" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#04342C">Uvicorn</text>
<text x="565" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">escucha las peticiones</text>

<line x1="565" y1="393" x2="565" y2="399" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="405" y="399" width="320" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="565" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#04342C">FastAPI (usa Pydantic)</text>
<text x="565" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">3. JWT valida el token, luego valida los datos</text>

<line x1="565" y1="435" x2="565" y2="441" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="405" y="441" width="320" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="565" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#04342C">SQLAlchemy (ORM)</text>
<text x="565" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">4. traduce a SQL (psycopg2-binary)</text>

<!-- Backend -> PostgreSQL -->
<line x1="565" y1="477" x2="510" y2="551" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="550" y="516" font-family="Arial, sans-serif" font-size="11" fill="#444441">5. ejecuta SQL</text>

<!-- PostgreSQL -->
<rect x="390" y="551" width="165" height="60" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="472" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#412402">PostgreSQL</text>
<text x="472" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#633806">base de datos</text>

<!-- Named volume -->
<rect x="575" y="551" width="165" height="60" rx="8" fill="#D3D1C7" stroke="#444441" stroke-width="1"/>
<text x="657" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Docker vol.</text>
<text x="657" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">guarda los datos</text>

<line x1="555" y1="581" x2="573" y2="581" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Alembic -->
<rect x="390" y="617" width="350" height="30" rx="6" fill="#ffffff" stroke="#993C1D" stroke-width="1"/>
<text x="565" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#712B13">Alembic aplica las migraciones sobre la base de datos</text>

<!-- Bind mounts (en el hueco entre la carpeta y Docker) -->
<line x1="280" y1="256" x2="388" y2="256" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="334" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">bind mount</text>

<line x1="280" y1="413" x2="388" y2="413" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="334" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">bind mount</text>

<!-- Cliente navegador (encima de Tu móvil) -->
<rect x="890" y="180" width="260" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="1020" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Navegador</text>
<text x="1020" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">(en tu PC)</text>

<path d="M1020 240 L1020 260 L742 260" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="840" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">1. Petición</text>
<text x="840" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">HTTP</text>

<!-- Móvil -->
<rect x="890" y="300" width="260" height="330" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="910" y="328" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#26215C">Tu móvil</text>

<rect x="910" y="347" width="220" height="56" rx="8" fill="#CECBF6" stroke="#3C3489" stroke-width="1"/>
<text x="1020" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">React Native</text>
<text x="1020" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">+ Expo</text>

<rect x="910" y="418" width="220" height="55" rx="8" fill="#CECBF6" stroke="#3C3489" stroke-width="1"/>
<text x="1020" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">SQLite / WatermelonDB</text>
<text x="1020" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">modo offline (a decidir)</text>

<rect x="910" y="488" width="220" height="50" rx="8" fill="#CECBF6" stroke="#3C3489" stroke-width="1"/>
<text x="1020" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">EAS build</text>
<text x="1020" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">genera el APK instalable</text>

<rect x="910" y="553" width="220" height="50" rx="8" fill="#CECBF6" stroke="#3C3489" stroke-width="1"/>
<text x="1020" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Tailscale</text>
<text x="1020" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">acceso remoto fuera de tu WiFi</text>

<!-- Móvil -> Backend (flecha recta, misma altura que Uvicorn) -->
<line x1="910" y1="375" x2="727" y2="375" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="840" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">1. Petición HTTP</text>
<text x="840" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">(WiFi, misma red)</text>

<!-- Nota de retorno -->
<text x="80" y="720" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A" font-style="italic">La respuesta (JSON) recorre el mismo camino en sentido inverso: PostgreSQL → SQLAlchemy → FastAPI → Uvicorn → cliente.</text>

</svg>
