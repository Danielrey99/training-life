<line x1="1020" y1="100" x2="940" y2="100" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="980" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

