<text x="650" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<path d="M1145,380 L1145,640 L470,640 L470,600" fill="none" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="808" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<!-- gris: sin ondelete explícito -->
<line x1="340" y1="480" x2="280" y2="480" stroke="#8A8980" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-gris)"/>

<!-- ============ LEYENDA ============ -->
<rect x="40" y="820" width="1240" height="425" rx="10" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="848" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2C2C2A">Dirección de las flechas:</text>
<text x="60" y="866" font-family="Arial, sans-serif" font-size="11" fill="#444441">Cada flecha va del HIJO (la tabla que tiene la columna FK, de donde sale) al PADRE (la tabla referenciada, a donde apunta).</text>
<text x="60" y="883" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#444441">CASCADE y RESTRICT son valores del atributo "ondelete", y ese atributo va siempre en la columna FK del HIJO: nunca se escribe nada de esto en el padre.</text>

<rect x="60" y="908" width="16" height="16" rx="3" fill="#0F6E56"/>
<text x="84" y="920" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha verde = ON DELETE CASCADE: al borrar el padre, este hijo se borra automáticamente con él.</text>

<rect x="60" y="930" width="16" height="16" rx="3" fill="#993C1D"/>
<text x="84" y="942" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha naranja = ON DELETE RESTRICT: no se puede borrar el padre mientras este hijo exista (el backend borra antes el hijo, a mano).</text>

<rect x="60" y="952" width="16" height="16" rx="3" fill="#8A8980"/>
<text x="84" y="964" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha gris discontinua = sin ondelete explícito (el comportamiento por defecto de Postgres: NO ACTION, parecido a RESTRICT).</text>

<text x="60" y="986" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">Las FK hacia usuarios no se dibujan: las siete tablas con usuario_id la tienen, todas sin ondelete, y serían siete flechas grises iguales hacia la misma caja.</text>

<text x="60" y="1018" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2C2C2A">Color de cada tabla:</text>
<rect x="60" y="1030" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="84" y="1042" font-family="Arial, sans-serif" font-size="11" fill="#444441">Beige = catálogo que no depende de nada: usuarios y grupos_musculares (los 17 grupos los siembra una migración).</text>

<rect x="60" y="1052" width="16" height="16" rx="3" fill="#9FE1CB" stroke="#0F6E56"/>
<text x="84" y="1064" font-family="Arial, sans-serif" font-size="11" fill="#444441">Verde = se puede ocultar (columna oculto_desde, la fecha desde la que está oculto): ejercicios, rutinas, rutina_slots y programas.</text>

<rect x="60" y="1074" width="16" height="16" rx="3" fill="#CECBF6" stroke="#3C3489"/>
<text x="84" y="1086" font-family="Arial, sans-serif" font-size="11" fill="#444441">Morado = historial: lo que se entrenó (entrenamientos, series) y en qué fechas estuvo activo cada programa (programa_periodos).</text>

<rect x="60" y="1096" width="16" height="16" rx="3" fill="#D3F1E5" stroke="#0F6E56"/>
<text x="84" y="1108" font-family="Arial, sans-serif" font-size="11" fill="#444441">Verde claro = accesorio de su padre, que no significa nada sin él y se borra con él (CASCADE): slot_alternativas, notas_usuario_ejercicio, programa_dias y excepciones_del_plan.</text>

<text x="60" y="1140" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">Por eso las relaciones hacia hijos con CASCADE llevan cascade="all, delete-orphan" y passive_deletes=True en SQLAlchemy: los hijos cargados los borra el ORM y los demás, la base de datos.</text>
<text x="60" y="1158" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">Rutina.slots, cuyo hijo es RESTRICT, lleva passive_deletes="all": el ORM no toca los huecos y decide siempre la restricción de la base de datos.</text>
<text x="60" y="1186" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">programa_periodos tiene además un índice único parcial sobre usuario_id (WHERE hasta IS NULL): un usuario no puede tener dos programas activos a la vez.</text>
<text x="60" y="1204" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">programa_dias, lo mismo sobre (programa_id, dia_semana): una sola fila vigente por día. Las cerradas son lo que tocaba antes: editar un programa no reescribe el pasado.</text>
<text x="60" y="1222" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">entrenamientos es único por (usuario_id, fecha): se entrena una rutina al día. Y por (usuario_id, cubre_fecha): un día del plan lo cuenta una sesión como mucho.</text>

</svg>
