<!-- ============ FLECHAS (del HIJO al PADRE, siempre en horizontal/vertical) ============ -->

<!-- verde: CASCADE -->
<line x1="340" y1="100" x2="280" y2="100" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="310" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="600" y1="100" x2="700" y2="100" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="650" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="160" y1="230" x2="160" y2="170" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="168" y="205" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<path d="M600,280 L650,280 L650,150 L700,150" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="625" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="1145" y1="230" x2="1145" y2="204" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="1153" y="221" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="820" y1="450" x2="820" y2="380" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="828" y="420" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="280" y1="585" x2="340" y2="585" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="310" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

