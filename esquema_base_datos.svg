<svg width="1320" height="950" viewBox="0 0 1320 950" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Esquema de la base de datos de Training Life: tablas y relaciones de borrado</title>
<desc>Diagrama de las 8 tablas implementadas y sus foreign keys, mostrando para cada una si es ON DELETE CASCADE, ON DELETE RESTRICT o sin ondelete explícito, y qué tablas tienen borrado lógico (columna activo) frente a las que son historial puro.</desc>
<defs>
<marker id="arrow-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-naranja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8980" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="1320" height="950" fill="#ffffff"/>

<!-- ============ TABLAS ============ -->

<!-- usuarios -->
<rect x="40" y="60" width="220" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="55" y="83" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">usuarios</text>
<text x="55" y="104" font-family="Arial, sans-serif" font-size="11" fill="#444441">id (PK)</text>
<text x="55" y="121" font-family="Arial, sans-serif" font-size="11" fill="#444441">nombre, email</text>

<!-- grupos_musculares -->
<rect x="40" y="200" width="220" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="55" y="223" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">grupos_musculares</text>
<text x="55" y="244" font-family="Arial, sans-serif" font-size="11" fill="#444441">id (PK)</text>
<text x="55" y="261" font-family="Arial, sans-serif" font-size="11" fill="#444441">nombre</text>

<!-- ejercicios -->
<rect x="340" y="120" width="260" height="150" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<text x="355" y="143" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">ejercicios</text>
<text x="355" y="164" font-family="Arial, sans-serif" font-size="11" fill="#085041">id (PK)</text>
<text x="355" y="182" font-family="Arial, sans-serif" font-size="11" fill="#085041">grupo_muscular_id → grupos_musculares</text>
<text x="355" y="200" font-family="Arial, sans-serif" font-size="11" fill="#085041">usuario_id → usuarios (opcional)</text>
<text x="355" y="222" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#04342C">activo (borrado lógico)</text>

<!-- rutinas -->
<rect x="680" y="50" width="220" height="110" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<text x="695" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">rutinas</text>
<text x="695" y="94" font-family="Arial, sans-serif" font-size="11" fill="#085041">id (PK)</text>
<text x="695" y="111" font-family="Arial, sans-serif" font-size="11" fill="#085041">usuario_id → usuarios</text>
<text x="695" y="133" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#04342C">activo (borrado lógico)</text>

<!-- rutina_slots -->
<rect x="680" y="210" width="220" height="150" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<text x="695" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">rutina_slots</text>
<text x="695" y="254" font-family="Arial, sans-serif" font-size="11" fill="#085041">id (PK)</text>
<text x="695" y="271" font-family="Arial, sans-serif" font-size="11" fill="#085041">rutina_id → rutinas</text>
<text x="695" y="288" font-family="Arial, sans-serif" font-size="11" fill="#085041">ejercicio_principal_id → ejercicios</text>
<text x="695" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#04342C">activo (borrado lógico)</text>

<!-- slot_alternativas -->
<rect x="680" y="410" width="220" height="100" rx="10" fill="#D3F1E5" stroke="#0F6E56" stroke-width="1.5"/>
<text x="695" y="433" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">slot_alternativas</text>
<text x="695" y="454" font-family="Arial, sans-serif" font-size="11" fill="#085041">id (PK)</text>
<text x="695" y="471" font-family="Arial, sans-serif" font-size="11" fill="#085041">slot_id → rutina_slots</text>
<text x="695" y="488" font-family="Arial, sans-serif" font-size="11" fill="#085041">ejercicio_id → ejercicios</text>

<!-- entrenamientos -->
<rect x="1000" y="50" width="230" height="100" rx="10" fill="#CECBF6" stroke="#3C3489" stroke-width="1.5"/>
<text x="1015" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">entrenamientos</text>
<text x="1015" y="94" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">id (PK)</text>
<text x="1015" y="111" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">usuario_id → usuarios</text>
<text x="1015" y="128" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">rutina_id → rutinas (opcional)</text>

<!-- series -->
<rect x="1000" y="210" width="250" height="140" rx="10" fill="#CECBF6" stroke="#3C3489" stroke-width="1.5"/>
<text x="1015" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">series</text>
<text x="1015" y="254" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">id (PK)</text>
<text x="1015" y="271" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">entrenamiento_id → entrenamientos</text>
<text x="1015" y="288" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">slot_id → rutina_slots (opcional)</text>
<text x="1015" y="305" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">ejercicio_id → ejercicios</text>

<!-- ============ FLECHAS (del HIJO al PADRE, siempre en horizontal/vertical) ============ -->

<!-- gris: sin ondelete explícito -->
<line x1="340" y1="135" x2="260" y2="135" stroke="#8A8980" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-gris)"/>
<line x1="340" y1="245" x2="260" y2="245" stroke="#8A8980" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-gris)"/>
<line x1="680" y1="90" x2="260" y2="90" stroke="#8A8980" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-gris)"/>
<path d="M1000,80 L1000,20 L260,20 L260,60" fill="none" stroke="#8A8980" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-gris)"/>

<!-- naranja: RESTRICT -->
<line x1="790" y1="210" x2="790" y2="160" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="800" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<line x1="680" y1="240" x2="600" y2="240" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="640" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<path d="M680,460 L580,460 L580,270" fill="none" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="586" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<line x1="1000" y1="100" x2="900" y2="100" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="950" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<line x1="1000" y1="280" x2="900" y2="280" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="950" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<path d="M1050,350 L1050,530 L460,530 L460,270" fill="none" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrow-naranja)"/>
<text x="466" y="480" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#993C1D">RESTRICT</text>

<!-- verde: CASCADE -->
<line x1="790" y1="410" x2="790" y2="360" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="800" y="390" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<line x1="1115" y1="210" x2="1115" y2="150" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#arrow-verde)"/>
<text x="1123" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6E56">CASCADE</text>

<!-- ============ LEYENDA (una sola columna, para que ninguna línea larga invada a la de al lado) ============ -->
<rect x="40" y="580" width="1240" height="340" rx="10" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="608" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2C2C2A">Dirección de las flechas:</text>
<text x="60" y="626" font-family="Arial, sans-serif" font-size="11" fill="#444441">Cada flecha va del HIJO (la tabla que tiene la columna FK — de donde sale) al PADRE (la tabla referenciada — a donde apunta).</text>
<text x="60" y="643" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#444441">CASCADE y RESTRICT son valores del atributo "ondelete", y ese atributo va siempre en la columna FK del HIJO — nunca se escribe nada de esto en el padre.</text>

<rect x="60" y="680" width="16" height="16" rx="3" fill="#0F6E56"/>
<text x="84" y="692" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha verde = ON DELETE CASCADE: al borrar el padre, este hijo se borra automáticamente con él.</text>

<rect x="60" y="702" width="16" height="16" rx="3" fill="#993C1D"/>
<text x="84" y="714" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha naranja = ON DELETE RESTRICT: no se puede borrar el padre mientras este hijo exista (el backend borra el hijo primero, a mano).</text>

<rect x="60" y="724" width="16" height="16" rx="3" fill="#8A8980"/>
<text x="84" y="736" font-family="Arial, sans-serif" font-size="11" fill="#444441">Flecha gris discontinua = sin ondelete explícito (comportamiento por defecto de Postgres: NO ACTION, similar a RESTRICT).</text>

<text x="60" y="766" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2C2C2A">Color de cada tabla:</text>
<rect x="60" y="778" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="84" y="790" font-family="Arial, sans-serif" font-size="11" fill="#444441">Beige = catálogo simple, no depende de nada (usuarios, grupos_musculares).</text>

<rect x="60" y="800" width="16" height="16" rx="3" fill="#9FE1CB" stroke="#0F6E56"/>
<text x="84" y="812" font-family="Arial, sans-serif" font-size="11" fill="#444441">Verde = tiene borrado lógico (columna activo): ejercicios, rutinas, rutina_slots.</text>

<rect x="60" y="822" width="16" height="16" rx="3" fill="#CECBF6" stroke="#3C3489"/>
<text x="84" y="834" font-family="Arial, sans-serif" font-size="11" fill="#444441">Morado = es el propio historial, sin activo: entrenamientos, series se borran directo.</text>

<rect x="60" y="844" width="16" height="16" rx="3" fill="#D3F1E5" stroke="#0F6E56"/>
<text x="84" y="856" font-family="Arial, sans-serif" font-size="11" fill="#444441">Verde claro = sin activo propio, pero no es historial libre como series: depende 100% de su padre (rutina_slots) y se borra con él (CASCADE) — solo slot_alternativas.</text>

<text x="60" y="892" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#5F5E5A">Por eso ejercicios/rutinas/rutina_slots llevan passive_deletes=True en su relationship(): para que SQLAlchemy confíe en el CASCADE real de la base de datos, sin poner a NULL la FK de sus hijos (slot_alternativas, series).</text>

</svg>
